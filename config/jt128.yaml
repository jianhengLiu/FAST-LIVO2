# Extrinsic parameters:
# --rotation:
#    0.999919   0.0114705  0.00545617
# -0.00887855    0.938349   -0.345575
# -0.00908371    0.345498    0.938376
# --translation:
# -0.00254614
#  -0.0416427
#  -0.0422893
# 参考说明https://github.com/hku-mars/FAST-LIVO2/issues/144
# extrin_calib:
#   extrinsic_T: [0.04165, 0.02326, -0.0284]
#   extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
#   Rcl: [0,0007053,-0.9998076,-0.0196039,
#         -0.0023628,0.0196021,-0.9998051,
#         0.9999978,0.0007515,-0.0023485] 
#   Pcl: [-0.0066253869, -0.0157590849,0.070738226]
common:
  img_topic: "/camera1/image_raw"
  lid_topic: "/lidar_points"
  imu_topic: "/lidar_imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false
extrin_calib:
  extrinsic_T: [ 0.0086, -0.0091, -0.0391]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # JT128 Lidar2Camera Parameters
  Rcl: [0.999919,   0.0114705,  0.00545617,
        -0.00887855,  0.938349, -0.345575,
        -0.00908371,  0.345498,  0.938376]
  Pcl: [-0.00254614, -0.0416427, -0.0422893]
  # Camera to LiDAR Parameters
  # Rcl: [0.99996, 0.00368865, -0.0080931, -0.000610441, 0.936262, 0.351303, 0.0088731, -0.351284, 0.936227]
  # Pcl: [-0.0018890710094699999, 0.039944375663619566, 0.026215277183213002]
time_offset: 
  imu_time_offset: 0.0  # 补偿 IMU 和 LiDAR 时间戳差异
  img_time_offset: 0.0
  exposure_time_init: 0.0
preprocess:
  point_filter_num: 5
  filter_size_surf: 0.1
  lidar_type: 8      # JT128 (Hesai 128-line, PointCloud2)
  scan_line: 128
  blind: 0.3
vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1
imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]
local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8
uav:
  imu_rate_odom: false
  gravity_align_en: true
publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0
evo:
  seq_name: "CBD_Building_01"
  pose_output_en: false
pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.1
  interval: 1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
image_save:
  img_save_en: false
  interval: 1